name: publish nuget

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # cache-mirror releases (mesa-cache-*) publish tarball assets, not
    # versioned artifacts: the release-triggered publish jobs skip them
    # gracefully instead of failing the version resolver.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      # the release-version resolver, inlined from the retired composite
      # action (the one-workflow-file standard: every workflow carries its
      # own steps - the .github/actions folder no longer exists).
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CHECKOUT_TAG: "true"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
      - name: add github source
        run: dotnet nuget add source --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
      - name: pack package
        run: dotnet pack saddle.csproj --configuration Release --output ./nuget -p:PackageVersion="${{ steps.release.outputs.version }}"
      - name: publish package
        run: dotnet nuget push "./nuget/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source github --skip-duplicate
