name: uka-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run formatcheck
      - run: npm test
      - run: npm run pack:check
