name: publish maven

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
      - name: resolve release version
        id: release
        uses: ./.github/actions/releaseversion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: setup java
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: publish package
        run: mvn --batch-mode --settings settings.xml -Drevision="${{ steps.release.outputs.version }}" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish the e2ugh maven artifact (grand-merge carrier)
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          existing=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://maven.pkg.github.com/wenathlan/saddle/io/github/wenathlan/e2ugh/${version}/e2ugh-${version}.pom")
          if [ "$existing" = "200" ]; then
            echo "e2ugh artifact ${version} already present — skipping the duplicate deploy"
            exit 0
          fi
          mvn --batch-mode --settings settings.xml -f e2ugh.pom.xml -Drevision="${version}" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
