services:
  saddle:
    build:
      context: .
      dockerfile: Dockerfile
      target: saddle-runtime
    image: ${SADDLE_IMAGE:-saddle:latest}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${SADDLE_PIDS_LIMIT:-512}
    tmpfs:
      - /tmp:size=${SADDLE_TMPFS_SIZE:-2G},mode=1777
    network_mode: ${SADDLE_NETWORK_MODE:-none}
    environment:
      SADDLE_MEMORY_ENGINE: ${SADDLE_MEMORY_ENGINE:-ram}
      SBOT_PLATFORM: ${SBOT_PLATFORM:-}
      SBOT_CDN_URL: ${SBOT_CDN_URL:-}
