name: resolve release version
description: Resolve the release tag and verify that package metadata matches it.
inputs:
  package:
    description: Package metadata file to validate.
    required: false
    default: package.json
  checkout_tag:
    description: Check out the release tag after validating it.
    required: false
    default: "true"
outputs:
  tag:
    description: Release tag without mutation.
    value: ${{ steps.resolve.outputs.tag }}
  version:
    description: Release version without the leading v.
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
        PACKAGE_FILE: ${{ inputs.package }}
        CHECKOUT_TAG: ${{ inputs.checkout_tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="${RELEASE_TAG:-}"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          tag="$(gh release view --json tagName --jq .tagName)"
        fi
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
          exit 1
        fi
        version="${tag#v}"
        git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
        if [[ "$CHECKOUT_TAG" == "true" ]]; then
          git checkout --detach "$tag"
        fi
        package_version=$(node -p "require('./${PACKAGE_FILE}').version")
        if [[ "$package_version" != "$version" ]]; then
          echo "Release tag ${tag} does not match package version ${package_version}" >&2
          exit 1
        fi
        {
          echo "tag=$tag"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"
