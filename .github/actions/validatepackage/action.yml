name: validate saddle package
description: Install dependencies and validate the package without publishing.
inputs:
  full:
    description: Run syntax, format and deterministic tests in addition to the package dry-run.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: install dependencies
      shell: bash
      run: npm ci
    - name: run full deterministic gates
      if: inputs.full == 'true'
      shell: bash
      run: npm run check && npm run formatcheck && npm test
    - name: package dry-run
      shell: bash
      run: npm run pack:check
