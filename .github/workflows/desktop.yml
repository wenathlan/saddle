name: desktop artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  desktop:
    name: desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows
            architecture: x86
            runner: windows-2025
            target: i686-pc-windows-msvc
            bundles: nsis,msi
          - platform: windows
            architecture: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: windows
            architecture: arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos
            architecture: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos
            architecture: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: resolve release version
        id: releaseversion
        uses: ./.github/actions/releaseversion
        with:
          checkout_tag: "false"

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: add target toolchain
        run: rustup target add "${{ matrix.target }}"

      - name: install linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm

      - name: install node dependencies
        run: npm ci

      - name: build shared web surface
        run: npm run web:build:pages

      - name: synchronize desktop version metadata
        shell: bash
        env:
          SADDLE_VERSION: ${{ steps.releaseversion.outputs.version }}
        run: |
          node -e 'const fs=require("node:fs"); const version=process.env.SADDLE_VERSION; const config=JSON.parse(fs.readFileSync("web/desktop/tauri.conf.json","utf8")); config.version=version; fs.writeFileSync("web/desktop/tauri.conf.json", `${JSON.stringify(config, null, 2)}\n`); const cargo=fs.readFileSync("web/desktop/Cargo.toml","utf8").replace(/^version = ".*"$/m, `version = "${version}"`); fs.writeFileSync("web/desktop/Cargo.toml", cargo);'

      - name: validate flat native surfaces
        run: npm run native:check:flat

      - name: generate platform icons
        shell: bash
        run: npx --yes @tauri-apps/cli@2.11.4 icon web/desktop/icon.svg --output web/desktop/icons

      - name: configure desktop signing status
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "${{ matrix.platform }}" = "windows" ] && [ -n "${WINDOWS_CERTIFICATE_BASE64:-}" ] && [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "SADDLE_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ matrix.platform }}" = "macos" ] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "SADDLE_SIGNING=caller-owned" >> "$GITHUB_ENV"
          else
            echo "SADDLE_SIGNING=unsigned" >> "$GITHUB_ENV"
          fi

      - name: configure macOS signing keychain
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ "${SADDLE_SIGNING}" != "caller-owned" ]; then exit 0; fi
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            test -n "${!value:-}" || { echo "$value is required for macOS signing."; exit 1; }
          done
          keychain="$RUNNER_TEMP/saddle-desktop.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/saddle-desktop.p12"
          security import "$RUNNER_TEMP/saddle-desktop.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

      - name: build desktop bundles
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          cd desktop
          if [ "${SADDLE_SIGNING}" = "caller-owned" ]; then
            npx --yes @tauri-apps/cli@2.11.4 build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          else
            npx --yes @tauri-apps/cli@2.11.4 build --ci --no-sign --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
          fi

      - name: sign Windows installers
        if: matrix.platform == 'windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if [ "${SADDLE_SIGNING}" != "caller-owned" ]; then exit 0; fi
          test -n "${WINDOWS_TIMESTAMP_URL:-}"
          printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/saddle-code-signing.pfx"
          sign_tool="$(where.exe signtool.exe | head -n 1 | tr -d '\r')"
          test -n "$sign_tool"
          while IFS= read -r -d '' file; do
            "$sign_tool" sign /fd SHA256 /td SHA256 /tr "$WINDOWS_TIMESTAMP_URL" /f "$RUNNER_TEMP/saddle-code-signing.pfx" /p "$WINDOWS_CERTIFICATE_PASSWORD" "$file"
            "$sign_tool" verify /pa /all "$file"
          done < <(find web/desktop/target/${{ matrix.target }} -type f \( -name '*.exe' -o -name '*.msi' \) -print0)

      - name: notarize macOS installers
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${SADDLE_SIGNING}" != "caller-owned" ]; then exit 0; fi
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            while IFS= read -r -d '' file; do
              xcrun notarytool submit "$file" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$file"
            done < <(find web/desktop/target/${{ matrix.target }} -type f -path '*/bundle/dmg/*.dmg' -print0)
            echo "SADDLE_NOTARIZATION=notarized" >> "$GITHUB_ENV"
          else
            echo "SADDLE_NOTARIZATION=not-configured" >> "$GITHUB_ENV"
          fi

      - name: collect desktop artifacts
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          mkdir -p build/release-assets/desktop
          target_dir="web/desktop/target/${{ matrix.target }}"
          case "${{ matrix.platform }}" in
            linux)
              deb="$(find "$target_dir" -type f -path '*/bundle/deb/*.deb' -print -quit)"
              rpm="$(find "$target_dir" -type f -path '*/bundle/rpm/*.rpm' -print -quit)"
              appimage="$(find "$target_dir" -type f -path '*/bundle/appimage/*.AppImage' -print -quit)"
              test -n "$deb" && test -n "$rpm" && test -n "$appimage"
              cp "$deb" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.deb"
              cp "$rpm" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.rpm"
              cp "$appimage" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.appimage"
              ;;
            windows)
              exe="$(find "$target_dir" -type f -path '*/bundle/nsis/*.exe' -print -quit)"
              msi="$(find "$target_dir" -type f -path '*/bundle/msi/*.msi' -print -quit)"
              test -n "$exe" && test -n "$msi"
              cp "$exe" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.exe"
              cp "$msi" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.msi"
              ;;
            macos)
              dmg="$(find "$target_dir" -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
              app="$(find "$target_dir" -type d -path '*/bundle/macos/*.app' -print -quit)"
              test -n "$dmg" && test -n "$app"
              cp "$dmg" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.dmg"
              ditto -c -k --sequesterRsrc --keepParent "$app" "build/release-assets/web/desktop/saddle.browser.${version}.${{ matrix.architecture }}.app.zip"
              ;;
          esac
          test -n "$(find build/release-assets/desktop -type f -print -quit)"
          checksums="sha256.desktop.${{ matrix.platform }}.${{ matrix.architecture }}.${version}"
          manifest="manifest.desktop.${{ matrix.platform }}.${{ matrix.architecture }}.${version}.json"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum build/release-assets/web/desktop/saddle.browser.* > "build/release-assets/web/desktop/${checksums}"; else shasum -a 256 build/release-assets/web/desktop/saddle.browser.* > "build/release-assets/web/desktop/${checksums}"; fi
          sed -i.bak 's#build/release-assets/web/desktop/##g' "build/release-assets/web/desktop/${checksums}" && rm -f "build/release-assets/web/desktop/${checksums}.bak"
          printf '{\n  "version": "%s",\n  "platform": "%s",\n  "architecture": "%s",\n  "signing": "%s",\n  "notarization": "%s",\n  "files": [' "$version" "${{ matrix.platform }}" "${{ matrix.architecture }}" "${SADDLE_SIGNING}" "${SADDLE_NOTARIZATION:-not-applicable}" > "build/release-assets/web/desktop/${manifest}"
          find build/release-assets/desktop -type f ! -name "${checksums}" ! -name "${manifest}" -exec basename {} \; | awk 'BEGIN { first=1 } { if (!first) printf ","; printf "\"%s\"", $0; first=0 }' >> "build/release-assets/web/desktop/${manifest}"
          printf ']\n}\n' >> "build/release-assets/web/desktop/${manifest}"
          ! find build/release-assets/desktop -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .

      - name: upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saddle.browser.${{ matrix.platform }}.${{ matrix.architecture }}.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/desktop
          if-no-files-found: error

      - name: attach release assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/web/desktop/* --clobber
