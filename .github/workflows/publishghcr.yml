name: publish ghcr

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  image: ghcr.io/${{ github.repository_owner }}/saddle

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      # the release-version resolver, inlined from the retired composite
      # action (the one-workflow-file standard: every workflow carries its
      # own steps - the .github/actions folder no longer exists).
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CHECKOUT_TAG: "true"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: login ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: setup qemu
        uses: docker/setup-qemu-action@v4
      - name: setup buildx
        uses: docker/setup-buildx-action@v4
      - name: resolve image tags
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          {
            echo "version=${version}"
            echo 'tags<<EOF'
            echo "${image}:${version}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      - name: build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: saddle:scan-${{ steps.release.outputs.version }}
          build-args: |
            SADDLE_VERSION=${{ steps.release.outputs.version }}
      - name: scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saddle:scan-${{ steps.release.outputs.version }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: build and push image with attestations
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # the node-engine runtime stage is the explicit target: the vhe
          # stages of the one container file are published by the publish
          # ghcr vhe workflow under the -vhe tag family.
          target: saddle-runtime
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            SADDLE_VERSION=${{ steps.release.outputs.version }}
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          provenance: mode=max
          sbom: true
      - name: verify published image index and smoke test amd64
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${image}:${{ steps.release.outputs.version }}"
          docker buildx imagetools inspect --raw "${image_ref}" | jq -e '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ]
            | sort
            | . == ["amd64", "arm64", "ppc64le"]
          '
          docker pull --quiet --platform linux/amd64 "${image_ref}"
          actual_version="$(docker image inspect "${image_ref}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "${actual_version}" = "${{ steps.release.outputs.version }}"
          docker run --rm --platform linux/amd64 "${image_ref}" help
