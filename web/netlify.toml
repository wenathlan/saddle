# static edge only; the sandbox api is self-hosted node (web/server.ts);
# no serverless functions per project rules. this file is read from the
# repository root; the build command produces the SPA dist at
# web/dist/public (npm run web:build:pages), and every route rewrites to
# index.html with 200 (single-page React app). deploy with either
#   netlify deploy --prod --dir web/dist/public
# or by connecting the repo and letting netlify read this file.

[build]
  command = "cd .. && npm run web:build:pages"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "26.7.0"

# SPA rewrite: every path serves the React entry, the router resolves it.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# security headers mirroring web/server.ts and the caddyfile; no
# functions, static edge only.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
