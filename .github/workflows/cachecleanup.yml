name: cache retention

on:
  workflow_run:
    workflows: ["codeql analysis"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete qualifying caches; false reports the candidates only
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: saddle-cache-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply == true }}
      DEFAULT_REF: refs/heads/main
      NONDEFAULT_MAX_AGE_HOURS: "6"
    steps:
      - name: retain bounded repository caches
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(date --utc --date="-${NONDEFAULT_MAX_AGE_HOURS} hours" +%s)"
          declare -A retained

          cachelimit() {
            case "$1" in
              codeql) printf '%s' 3 ;;
              node) printf '%s' 2 ;;
              java) printf '%s' 1 ;;
              *) printf '%s' 1 ;;
            esac
          }

          cachefamily() {
            case "$1" in
              codeql-*) printf '%s' codeql ;;
              node-cache-*) printf '%s' node ;;
              Linux-jdk*) printf '%s' java ;;
              *) printf '%s' other ;;
            esac
          }

          while IFS=$'\t' read -r cache_id accessed_at ref key; do
            test -n "$cache_id" || continue
            family="$(cachefamily "$key")"
            delete_reason=""

            if [ "$ref" = "$DEFAULT_REF" ]; then
              retained_count="${retained[$family]:-0}"
              if [ "$retained_count" -lt "$(cachelimit "$family")" ]; then
                retained[$family]=$((retained_count + 1))
                continue
              fi
              delete_reason="exceeds-${family}-limit-on-default-ref"
            else
              accessed_epoch="$(date --utc --date="$accessed_at" +%s)"
              if [ "$accessed_epoch" -gt "$cutoff_epoch" ]; then
                continue
              fi
              delete_reason="aged-nondefault-ref"
            fi

            printf 'candidate id=%s ref=%s family=%s reason=%s key=%s\n' "$cache_id" "$ref" "$family" "$delete_reason" "$key"
            if [ "$APPLY" = "true" ]; then
              if ! gh api --method DELETE "repos/${GH_REPO}/actions/caches/${cache_id}"; then
                echo "cache id=${cache_id} was already unavailable; continuing retention."
              fi
            fi
          done < <(gh api --paginate "repos/${GH_REPO}/actions/caches?per_page=100&sort=last_accessed_at&direction=desc" --jq '.actions_caches[] | [.id, .last_accessed_at, .ref, .key] | @tsv')

          if [ "$APPLY" != "true" ]; then
            echo "Dry run complete; no cache was deleted."
          fi
