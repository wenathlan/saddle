name: build extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to package; empty uses the latest release
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  package:
    # cache-mirror releases (mesa-cache-*) publish tarball assets, not
    # versioned artifacts: the release-triggered jobs skip them gracefully
    # instead of failing the version resolver.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      # the release-version resolver, inlined from the retired composite
      # action (the one-workflow-file standard: every workflow carries its
      # own steps — the .github/actions folder no longer exists).
      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CHECKOUT_TAG: "true"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26.7.0

      # the package validator, inlined from the retired composite action
      # (full deterministic gates plus the pack dry-run).
      - name: install dependencies
        run: npm ci
      - name: run full deterministic gates
        run: npm run check && npm run formatcheck && npm test
      - name: package dry-run
        run: npm run pack:check

      - name: generate extension icons
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2.11.4 icon web/desktop/icon.svg --output build/generated-icons
          mkdir -p web/extension/icons
          cp build/generated-icons/32x32.png web/extension/icons/icon32.png
          cp build/generated-icons/64x64.png web/extension/icons/icon64.png
          cp build/generated-icons/128x128.png web/extension/icons/icon128.png

      - name: build extension
        run: npm run build:engine && node dist/browser.js --version "${{ steps.releaseversion.outputs.version }}" --output build/extension

      - name: create zip
        run: |
          cd build/extension
          zip -qr "../../saddle.extension.${{ steps.releaseversion.outputs.version }}.zip" .

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: saddle.extension.${{ steps.releaseversion.outputs.version }}
          path: saddle.extension.${{ steps.releaseversion.outputs.version }}.zip
          if-no-files-found: error

      - name: attach release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releaseversion.outputs.tag }}
          ASSET: saddle.extension.${{ steps.releaseversion.outputs.version }}.zip
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber
