name: mobile artifacts

on:
  release:
    types: [published]
  workflow_run:
    # the e2ugh dual-trigger pattern (the documented exception to the
    # GITHUB_TOKEN event suppression): the release published event fired
    # by the release validation workflow's GITHUB_TOKEN never cascades,
    # so this publish also fires when release validation completes
    # successfully on a version bump (the job gate below requires
    # conclusion success and the triggering event to be the bump push).
    workflows: ["release validation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package
        required: true
        type: string
      build_ios:
        description: Build iOS only when Apple signing and provisioning secrets are configured
        required: true
        default: false
        type: boolean
      allow_test_signing:
        description: Allow a clearly labeled CI test key for manual Android builds; published releases use it automatically only when production Android secrets are unavailable
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

concurrency:
  group: saddle-mobile-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    # cache-mirror releases (mesa-cache-*) publish tarball assets, not
    # versioned artifacts: the release-triggered jobs skip them gracefully
    # instead of failing the version resolver.
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    name: android release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      # the release-version resolver, inlined from the retired composite
      # action (the one-workflow-file standard: every workflow carries its
      # own steps - the .github/actions folder no longer exists).
      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CHECKOUT_TAG: "false"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: setup java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: setup android
        uses: android-actions/setup-android@v3
      - name: install android sdk packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: install node dependencies
        run: npm ci
      - name: build shared web surface
        run: npm run web:build:pages
      - name: synchronize capacitor android surface
        run: npx cap sync android
      - name: flatten generated android staging
        run: npm run capacitor:flatten:android
      - name: validate flat native surfaces
        run: npm run native:check:flat
      - name: generate Android icons
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2.11.4 icon web/desktop/icon.svg --output build/generated-icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "build/generated-icons/android/mipmap-${density}/ic_launcher.png" "web/android/res/mipmap-${density}/ic_launcher.png"
            cp "build/generated-icons/android/mipmap-${density}/ic_launcher_foreground.png" "web/android/res/mipmap-${density}/ic_launcher_foreground.png"
            cp "build/generated-icons/android/mipmap-${density}/ic_launcher_round.png" "web/android/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: derive android version values
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "SADDLE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SADDLE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: configure android signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          production_ready=false
          if [ -n "${ANDROID_KEY_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_STORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            production_ready=true
          fi
          if [ "$production_ready" = true ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/saddle-upload.jks"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/saddle-upload.jks"
              printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > web/android/keystore.properties
            echo "SADDLE_SIGNING=caller-owned" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.allow_test_signing }}" = "true" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/saddle-test.jks" -storepass changeit -keypass changeit -alias saddle-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Saddle CI Test,O=Saddle,C=US"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/saddle-test.jks"
              printf 'storePassword=changeit\n'
              printf 'keyAlias=saddle-test\n'
              printf 'keyPassword=changeit\n'
            } > web/android/keystore.properties
            echo "SADDLE_SIGNING=ci-test-key" >> "$GITHUB_ENV"
          else
            echo "Manual Android builds require production signing secrets or allow_test_signing=true."
            exit 1
          fi
      - name: build optimized android release
        shell: bash
        run: |
          chmod +x web/android/gradlew
          cd web/android
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
      - name: collect android artifacts
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          mkdir -p build/release-assets/android
          apk="saddle.apk.${version}.apk"
          aab="saddle.aab.${version}.aab"
          checksums="sha256.android.${version}"
          manifest="manifest.android.${version}.json"
          apk_source="$(find web/android/build/outputs/apk/release -type f \( -name 'android-release*.apk' -o -name 'app-release*.apk' \) -print -quit)"
          aab_source="$(find web/android/build/outputs/bundle/release -type f \( -name 'android-release*.aab' -o -name 'app-release*.aab' \) -print -quit)"
          test -n "$apk_source" && test -n "$aab_source"
          cp "$apk_source" "build/release-assets/android/${apk}"
          cp "$aab_source" "build/release-assets/android/${aab}"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "build/release-assets/android/${apk}"
          jarsigner -verify -verbose -certs "build/release-assets/android/${aab}" >/dev/null
          sha256sum "build/release-assets/android/${apk}" "build/release-assets/android/${aab}" | sed 's#build/release-assets/android/##' > "build/release-assets/android/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "android",\n  "signing": "%s",\n  "optimization": "r8-and-resource-shrinking",\n  "files": ["%s", "%s"]\n}\n' "$version" "${SADDLE_SIGNING:-unknown}" "$apk" "$aab" > "build/release-assets/android/${manifest}"
      - name: validate public asset names
        shell: bash
        run: |
          ! find build/release-assets/android -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .
      - name: upload android artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: saddle.android.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/android
          if-no-files-found: error
      - name: attach android assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/android/* --clobber

  ios:
    name: ios ipa
    # the ios build only runs on explicit dispatch or the repo variable;
    # cache-mirror releases never reach it.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_ios == true) || vars.SADDLE_IOS_ENABLED == 'true' }}
    runs-on: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      # the release-version resolver, inlined from the retired composite
      # action (the one-workflow-file standard: every workflow carries its
      # own steps - the .github/actions folder no longer exists).
      - name: resolve release version
        id: releaseversion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CHECKOUT_TAG: "false"
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if [[ "$CHECKOUT_TAG" == "true" ]]; then
            git checkout --detach "$tag"
          fi
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      - name: install node dependencies
        run: npm ci
      - name: build shared web surface
        run: npm run web:build:pages
      - name: synchronize capacitor ios surface
        run: npx cap sync ios
      - name: validate flat native surfaces
        run: npm run native:check:flat
      - name: generate iOS icons
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2.11.4 icon web/desktop/icon.svg --output build/generated-icons
          iconroot=web/ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp build/generated-icons/ios/AppIcon-20x20@1x.png "$iconroot/AppIcon-20.png"
          cp build/generated-icons/ios/AppIcon-20x20@2x.png "$iconroot/AppIcon-40.png"
          cp build/generated-icons/ios/AppIcon-20x20@3x.png "$iconroot/AppIcon-60.png"
          cp build/generated-icons/ios/AppIcon-29x29@1x.png "$iconroot/AppIcon-29.png"
          cp build/generated-icons/ios/AppIcon-29x29@2x.png "$iconroot/AppIcon-58.png"
          cp build/generated-icons/ios/AppIcon-29x29@3x.png "$iconroot/AppIcon-87.png"
          cp build/generated-icons/ios/AppIcon-40x40@1x.png "$iconroot/AppIcon-40-1.png"
          cp build/generated-icons/ios/AppIcon-40x40@2x.png "$iconroot/AppIcon-80.png"
          cp build/generated-icons/ios/AppIcon-60x60@2x.png "$iconroot/AppIcon-120.png"
          cp build/generated-icons/ios/AppIcon-60x60@3x.png "$iconroot/AppIcon-180.png"
          cp build/generated-icons/ios/AppIcon-76x76@1x.png "$iconroot/AppIcon-76.png"
          cp build/generated-icons/ios/AppIcon-76x76@2x.png "$iconroot/AppIcon-152.png"
          cp build/generated-icons/ios/AppIcon-83.5x83.5@2x.png "$iconroot/AppIcon-83.5.png"
          cp build/generated-icons/ios/AppIcon-512@2x.png "$iconroot/AppIcon-512.png"
      - name: configure Apple signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          for value in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD IOS_PROVISIONING_PROFILE_NAME; do
            test -n "${!value:-}" || { echo "$value is required when iOS packaging is enabled."; exit 1; }
          done
          keychain="$RUNNER_TEMP/saddle-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/saddle-distribution.p12"
          security import "$RUNNER_TEMP/saddle-distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROVISIONING_PROFILE_NAME}.mobileprovision"
      - name: configure ios export options
        env:
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: |
          if [ -z "${IOS_EXPORT_OPTIONS_BASE64:-}" ]; then
            echo "IOS_EXPORT_OPTIONS_BASE64 is required when iOS packaging is enabled."
            exit 1
          fi
          printf '%s' "$IOS_EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/SaddleExportOptions.plist"
      - name: derive ios version values
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "SADDLE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SADDLE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: archive ios app
        run: xcodebuild -project web/ios/App/App.xcodeproj -scheme App -configuration Release -archivePath "$RUNNER_TEMP/Saddle.xcarchive" archive MARKETING_VERSION="$SADDLE_VERSION" CURRENT_PROJECT_VERSION="$SADDLE_VERSION_CODE"
      - name: export ipa
        run: xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Saddle.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/SaddleExportOptions.plist" -exportPath "$RUNNER_TEMP/SaddleExport"
      - name: collect ios artifacts
        shell: bash
        run: |
          version="${{ steps.releaseversion.outputs.version }}"
          mkdir -p build/release-assets/ios
          ipa="saddle.ipa.${version}.ipa"
          app="saddle.app.${version}.app.zip"
          checksums="sha256.ios.${version}"
          manifest="manifest.ios.${version}.json"
          source="$(find "$RUNNER_TEMP/SaddleExport" -type f -name '*.ipa' -print -quit)"
          app_source="$(find "$RUNNER_TEMP/SaddleExport/Payload" -type d -name '*.app' -print -quit)"
          test -n "$source" && test -n "$app_source"
          cp "$source" "build/release-assets/ios/${ipa}"
          ditto -c -k --sequesterRsrc --keepParent "$app_source" "build/release-assets/ios/${app}"
          shasum -a 256 build/release-assets/ios/* | sed 's#build/release-assets/ios/##' > "build/release-assets/ios/${checksums}"
          printf '{\n  "version": "%s",\n  "platform": "ios",\n  "signing": "caller-configured",\n  "files": ["%s", "%s"]\n}\n' "$version" "$ipa" "$app" > "build/release-assets/ios/${manifest}"
      - name: validate public asset names
        shell: bash
        run: |
          ! find build/release-assets/ios -type f \( -name 'build_script_build*.exe' -o -name 'build-script-build.exe' -o -name '*_*' \) -print -quit | grep -q .
      - name: upload ios artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: saddle.ios.${{ steps.releaseversion.outputs.version }}
          path: build/release-assets/ios
          if-no-files-found: error
      - name: attach ios assets
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release-assets/ios/* --clobber
