name: publish rubygems

on:
  release:
    types: [published]
  workflow_run:
    # the e2ugh dual-trigger pattern (the documented exception to the
    # GITHUB_TOKEN event suppression): the release published event fired
    # by the release validation workflow's GITHUB_TOKEN never cascades,
    # so this publish also fires when release validation completes
    # successfully on a version bump (the job gate below requires
    # conclusion success and the triggering event to be the bump push).
    workflows: ["release validation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release version
    # cache-mirror releases (mesa-cache-*) publish tarball assets, not
    # versioned artifacts: the release-triggered publish jobs skip them
    # gracefully instead of failing the version resolver.
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # packages: read is required to query the GitHub Packages RubyGems
      # registry versions list (the pre-deploy existence check). The
      # publish job below escalates to packages: write.
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      proceed: ${{ steps.release.outputs.proceed }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # full history plus tags: the resolver materializes and verifies
          # the version tag against the package.json of its commit.
          fetch-depth: 0
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
      # the release-version resolver, inlined from the retired composite
      # action (the one-workflow-file standard: every workflow carries its
      # own steps - the .github/actions folder no longer exists), carrying
      # the e2ugh idempotency gates: the tag==HEAD "already shipped" guard,
      # the published-release check and the RubyGems versions-list
      # existence check, so a duplicate firing no-ops instead of failing
      # the lane.
      - name: resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail
          {
            echo "version="
            echo "tag="
            echo "proceed=false"
          } >> "$GITHUB_OUTPUT"
          requested="${RELEASE_TAG:-}"
          if [ -n "$requested" ]; then
            # an event names a tag (the release published path): verify
            # THAT tag against the package.json of its commit.
            tag="$requested"
          elif [ "${AUTOMATIC}" = "true" ]; then
            # the automatic workflow_run path (the e2ugh resolver): the
            # version comes from the default-branch metadata - the
            # version-bump commit the completed validation ran on.
            tag="v$(node -p "require('./package.json').version")"
          else
            # manual dispatch: the latest release.
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag such as v1.8.0 is required; received: ${tag:-<empty>}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if [ "${AUTOMATIC}" = "true" ]; then
              echo "Tag ${tag} does not exist; the release lane creates it on version bumps. Skipping."
              exit 0
            fi
            echo "Tag ${tag} does not exist; the release lane creates it on version bumps." >&2
            exit 1
          fi
          if [ "${AUTOMATIC}" = "true" ]; then
            # the e2ugh "already shipped" guard: on the automatic path the
            # resolver runs on the default-branch head, so a tag pointing
            # elsewhere means the release for it already shipped and this
            # firing no-ops instead of republishing.
            if [ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${tag} does not point at this source; the release for it already shipped. Skipping."
              exit 0
            fi
          fi
          git checkout --detach "$tag" 2>/dev/null || {
            echo "Tag ${tag} does not exist." >&2
            exit 1
          }
          package_version=$(node -p "require('./package.json').version")
          if [[ "$package_version" != "$version" ]]; then
            echo "Release tag ${tag} does not match package version ${package_version}" >&2
            exit 1
          fi
          if ! gh api "repos/${GH_REPO}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "No published GitHub release for ${tag}; the release lane skipped this bump. Skipping."
            exit 0
          fi
          # Pre-deploy existence check (the e2ugh idempotency gate): the
          # workflow_run trigger can fire multiple times for the same
          # release completion, and the tag==HEAD guard above does NOT
          # short-circuit the duplicate-firing case where the tag still
          # points at HEAD. The GitHub Packages RubyGems registry rejects
          # re-uploads with the "Version X.Y.Z of saddle has already been
          # pushed" error. Query the registry versions list; if the
          # version is already published, exit 0 (proceed stays false) so
          # the duplicate firing no-ops instead of failing the workflow.
          #
          # Robustness note: gh api writes error JSON to STDOUT (not
          # stderr) on 401/403/404, so `2>/dev/null` alone cannot
          # suppress it. The `|| true` ensures the subshell exits 0, then
          # the case statement validates the captured string is a pure
          # non-negative integer; anything else (error JSON, empty, etc.)
          # is treated as "not published yet" so a transient API failure
          # does not silently skip a publish.
          api_out="$(gh api "/users/${OWNER}/packages/rubygems/saddle/versions" --jq "[.[] | select(.name == \"${version}\")] | length" 2>/dev/null || true)"
          case "${api_out}" in
            ''|*[!0-9]*) api_out=0 ;;
          esac
          if [ "${api_out}" != "0" ]; then
            echo "::notice::RubyGems saddle-${version} is already published to GitHub Packages; the publication is skipped (job success, no publish steps run)."
            exit 0
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish saddle to GitHub Packages (RubyGems)
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          # needs.resolve.outputs.tag is v<version> validated against the
          # package.json of the tagged commit - never raw event data.
          ref: ${{ needs.resolve.outputs.tag }}
      - name: setup ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: ruby
      - name: configure github credentials
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "${HOME}/.gem/credentials"
          chmod 600 "${HOME}/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build gem
        run: SADDLE_VERSION="${{ needs.resolve.outputs.version }}" gem build saddle.gemspec
      - name: publish gem
        shell: bash
        run: gem push saddle-*.gem --key github --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}"
