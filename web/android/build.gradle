import java.io.FileInputStream
import groovy.json.JsonSlurper
import java.util.Properties

// The Android application module is the repository root. Saddle-owned sources,
// resources and the manifest are mapped directly from the android surface.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

apply plugin: 'com.android.application'
apply from: 'variables.gradle'

def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}
def packageJson = new JsonSlurper().parse(rootProject.file('../package.json'))
def saddleVersion = (System.getenv('SADDLE_VERSION') ?: packageJson.version).toString()
def versionParts = saddleVersion.tokenize('.')
def saddleVersionCode = (System.getenv('SADDLE_VERSION_CODE') ?: (versionParts[0].toInteger() * 1000000 + versionParts[1].toInteger() * 1000 + versionParts[2].toInteger())).toInteger()

android {
    namespace = 'com.wenathlan.saddle'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.wenathlan.saddle'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = saddleVersionCode
        versionName = saddleVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['main']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test']
        }
        androidTest {
            java.srcDirs = ['androidtest']
        }
    }

    signingConfigs {
        if (signingPropertiesFile.exists()) {
            release {
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir {
        dirs 'capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor-cordova-android-plugins/cordova.variables.gradle'

if (hasProperty('postBuildExtras')) {
    postBuildExtras()
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception exception) {
    logger.info('google-services.json not found; google-services plugin not applied.')
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.named('clean') {
    delete rootProject.layout.buildDirectory
}
