name: codeql analysis

# The CodeQL lane of the security surface: the github/codeql-action scans
# the languages that really exist in this repository - the workflow files
# themselves (actions), the TypeScript engine + web surface
# (javascript-typescript) and the desktop Rust shell (web/desktop, the
# tauri carrier) - with build-mode none (no compiled language needs a
# manual build). The other scanners (dependency review, npm audit, cargo
# audit, osv, trufflehog, trivy, sbom) live in security.yml; this file
# owns only the CodeQL analysis and its SARIF upload.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # weekly, wednesday 04:25 UTC - off-peak from the security.yml lane
    - cron: "25 4 * * 3"
  workflow_dispatch:

permissions:
  # required for all workflows
  security-events: write
  # required to fetch internal or private CodeQL packs
  packages: read
  # only required for workflows in private repositories
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # the .github/workflows surface itself
          - language: actions
            build-mode: none
          # the root engine domains + the web React surface
          - language: javascript-typescript
            build-mode: none
          # the web/desktop tauri shell (Cargo.toml, main.rs, lib.rs)
          - language: rust
            build-mode: none
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
